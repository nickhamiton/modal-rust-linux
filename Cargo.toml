[package]
name = "modal-rust"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Modal.com - deploy and invoke serverless functions"
authors = ["nick"]
license = "MIT"
repository = "https://github.com/me/modal-rust"
keywords = ["modal", "serverless", "cloud", "functions"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "modal"
path = "src/lib.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"] }
bytes = "1.5"
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4"] }
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3.2"
